name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git merge-base --is-ancestor HEAD origin/main

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: doom-*
          merge-multiple: true
          path: dist
      - name: Verify archives and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          for checksum in ./*.sha256; do sha256sum -c "$checksum"; done
          sha256sum ./*.tar.gz > checksums.txt
          state="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .draft')"
          if [[ "$state" == false ]]; then
            echo 'A published release already exists for this tag' >&2
            exit 1
          fi
          if [[ "$state" != true ]]; then
            gh release create "$TAG" --verify-tag --draft --title "DOOM $TAG" --generate-notes
          fi
          gh release upload "$TAG" ./*.tar.gz checksums.txt --clobber
          gh release edit "$TAG" --draft=false --latest
